name: Validate, build and publish plane_pymavlink

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVPI_SERVER: https://stablekite.com:4438/
  DEVPI_TARGET_INDEX: https://stablekite.com:4438/StableKite/index/

jobs:
  validate:
    name: Validate Plane protocol
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python 3.14t
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      - name: Install validation dependency
        run: python -m pip install --upgrade lxml

      - name: Verify XML definitions and generate common dialect
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from importlib import util
          from pathlib import Path
          import io
          import struct
          import sys
          import xml.etree.ElementTree as ET

          common_xml = Path("message_definitions/v1.0/common.xml")
          root = ET.parse(common_xml).getroot()

          messages = {
              int(message.attrib["id"]): message
              for message in root.findall("./messages/message")
          }

          expected = {
              3: (
                  "PLANE_TARGET_BBOX",
                  [
                      ("time_boot_ms", "uint32_t"),
                      ("shoot_time_ms", "uint32_t"),
                      ("time", "uint32_t"),
                      ("score", "float"),
                      ("left", "float"),
                      ("top", "float"),
                      ("right", "float"),
                      ("bottom", "float"),
                      ("target_id", "int8_t"),
                      ("track_id", "uint8_t"),
                  ],
                  35,
              ),
              9: (
                  "PLANE_TARGET_ID",
                  [
                      ("time_boot_ms", "uint32_t"),
                      ("target_id", "int8_t"),
                  ],
                  6,
              ),
              10: (
                  "PLANE_NO_TARGET",
                  [
                      ("time_boot_ms", "uint32_t"),
                      ("shoot_time_ms", "uint32_t"),
                  ],
                  9,
              ),
          }

          type_sizes = {
              "uint8_t": 1,
              "int8_t": 1,
              "uint32_t": 4,
              "float": 4,
          }

          for message_id, (name, fields, raw_size) in expected.items():
              message = messages.get(message_id)
              if message is None:
                  raise SystemExit(
                      f"Message id {message_id} ({name}) is missing"
                  )

              if message.attrib.get("name") != name:
                  raise SystemExit(
                      f"Message id {message_id} has unexpected name: "
                      f"{message.attrib.get('name')!r}"
                  )

              actual_fields = [
                  (field.attrib["name"], field.attrib["type"])
                  for field in message.findall("field")
              ]
              if actual_fields != fields:
                  raise SystemExit(
                      f"{name} fields do not match the protocol:\n"
                      f"expected: {fields}\n"
                      f"actual:   {actual_fields}"
                  )

              calculated = 1 + sum(
                  type_sizes[field_type]
                  for _, field_type in actual_fields
              )
              if calculated != raw_size:
                  raise SystemExit(
                      f"{name}: expected raw UDP size {raw_size}, "
                      f"calculated {calculated}"
                  )

          assert struct.calcsize("<BIIIfffffbB") == 35
          assert struct.calcsize("<BIb") == 6
          assert struct.calcsize("<BII") == 9

          target_id = messages[9].find(
              "./field[@name='target_id']"
          )
          if target_id is None or target_id.attrib["type"] != "int8_t":
              raise SystemExit(
                  "PLANE_TARGET_ID.target_id must be signed int8_t"
              )

          sys.path.insert(0, str(Path("pymavlink").resolve()))
          from generator import mavgen, mavparse

          generated = Path("generated/common.py")
          generated.parent.mkdir(parents=True, exist_ok=True)

          opts = mavgen.Opts(
              str(generated),
              wire_protocol=mavparse.PROTOCOL_2_0,
              language="Python3",
              validate=True,
          )

          if not mavgen.mavgen(opts, [str(common_xml)]):
              raise SystemExit("MAVLink common dialect generation failed")

          spec = util.spec_from_file_location(
              "stablekite_generated_common",
              generated,
          )
          if spec is None or spec.loader is None:
              raise SystemExit("Could not load generated common dialect")

          common = util.module_from_spec(spec)
          spec.loader.exec_module(common)

          bbox_cls = common.MAVLink_plane_target_bbox_message
          target_cls = common.MAVLink_plane_target_id_message
          no_target_cls = common.MAVLink_plane_no_target_message

          assert bbox_cls.id == 3
          assert target_cls.id == 9
          assert no_target_cls.id == 10

          assert list(bbox_cls.fieldnames) == [
              "time_boot_ms",
              "shoot_time_ms",
              "time",
              "score",
              "left",
              "top",
              "right",
              "bottom",
              "target_id",
              "track_id",
          ]
          assert list(target_cls.fieldnames) == [
              "time_boot_ms",
              "target_id",
          ]
          assert list(no_target_cls.fieldnames) == [
              "time_boot_ms",
              "shoot_time_ms",
          ]

          mav = common.MAVLink(io.BytesIO())

          bbox = bbox_cls(
              time_boot_ms=1,
              shoot_time_ms=2,
              time=3,
              score=0.9,
              left=0.1,
              top=0.2,
              right=0.8,
              bottom=0.9,
              target_id=7,
              track_id=7,
          )
          target = target_cls(
              time_boot_ms=1,
              target_id=-1,
          )
          no_target = no_target_cls(
              time_boot_ms=1,
              shoot_time_ms=2,
          )

          assert bbox.pack(mav)[1] == 34
          assert target.pack(mav)[1] == 5
          assert no_target.pack(mav)[1] == 8
          assert target.target_id == -1

          print("Plane MAVLink protocol validation OK")
          PY


  build:
    name: Build plane_pymavlink
    needs: validate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python 3.14t
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      - name: Install build tools
        run: >-
          python -m pip install --upgrade
          build
          setuptools
          wheel
          cython
          lxml

      - name: Make source distribution self-contained
        shell: bash
        run: |
          set -euo pipefail

          rm -rf pymavlink/message_definitions
          cp -a message_definitions pymavlink/message_definitions

          python - <<'PY'
          from pathlib import Path

          manifest = Path("pymavlink/MANIFEST.in")
          text = manifest.read_text(encoding="utf-8")

          entry = "recursive-include message_definitions *.xml"
          if entry not in text.splitlines():
              if text and not text.endswith("\n"):
                  text += "\n"
              text += entry + "\n"

          manifest.write_text(text, encoding="utf-8")
          print(manifest.read_text(encoding="utf-8"))
          PY

      - name: Build wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail

          (
            cd pymavlink

            export PYMAVLINK_FAST_INDEX=0
            export MDEF="$PWD/message_definitions"

            python -m build \
              --no-isolation \
              --wheel \
              --sdist \
              --outdir "$GITHUB_WORKSPACE/dist"
          )

      - name: Verify distributions
        shell: bash
        run: |
          python - <<'PY'
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))

          if len(wheels) != 1:
              raise SystemExit(
                  f"Expected exactly one wheel, got: {wheels}"
              )
          if len(sdists) != 1:
              raise SystemExit(
                  f"Expected exactly one sdist, got: {sdists}"
              )

          wheel = wheels[0]
          sdist = sdists[0]

          if not wheel.name.startswith("plane_pymavlink-"):
              raise SystemExit(
                  f"Unexpected wheel name: {wheel.name}"
              )
          if not wheel.name.endswith("-py3-none-any.whl"):
              raise SystemExit(
                  f"Expected a pure-Python wheel: {wheel.name}"
              )

          with zipfile.ZipFile(wheel) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(
                      f"Corrupt wheel member: {bad}"
                  )

              names = set(archive.namelist())
              common_name = (
                  "plane_pymavlink/dialects/v20/common.py"
              )
              if common_name not in names:
                  raise SystemExit(
                      f"Wheel is missing {common_name}"
                  )

              generated = archive.read(
                  common_name
              ).decode("utf-8")
              for marker in (
                  "MAVLink_plane_target_bbox_message",
                  "MAVLink_plane_target_id_message",
                  "MAVLink_plane_no_target_message",
              ):
                  if marker not in generated:
                      raise SystemExit(
                          f"Generated common dialect is missing {marker}"
                      )

              metadata_name = next(
                  name
                  for name in names
                  if name.endswith(".dist-info/METADATA")
              )
              metadata = BytesParser(
                  policy=default
              ).parsebytes(
                  archive.read(metadata_name)
              )

          if metadata["Name"].lower().replace("-", "_") != \
                  "plane_pymavlink":
              raise SystemExit(
                  f"Unexpected package name: {metadata['Name']!r}"
              )

          version = metadata["Version"]
          if not version:
              raise SystemExit("Package version is empty")

          with tarfile.open(sdist, "r:gz") as archive:
              names = archive.getnames()

              required_suffixes = (
                  "/setup.py",
                  "/pyproject.toml",
                  "/message_definitions/v1.0/common.xml",
                  "/generator/mavschema.xsd",
              )

              for suffix in required_suffixes:
                  if not any(
                      name.endswith(suffix)
                      for name in names
                  ):
                      raise SystemExit(
                          f"Source distribution is missing: {suffix}"
                      )

              common_member = next(
                  name
                  for name in names
                  if name.endswith(
                      "/message_definitions/v1.0/common.xml"
                  )
              )
              source = archive.extractfile(common_member)
              if source is None:
                  raise SystemExit(
                      f"Could not read {common_member}"
                  )

              xml_text = source.read().decode("utf-8")
              for marker in (
                  'id="3" name="PLANE_TARGET_BBOX"',
                  'id="9" name="PLANE_TARGET_ID"',
                  'id="10" name="PLANE_NO_TARGET"',
              ):
                  if marker not in xml_text:
                      raise SystemExit(
                          f"sdist common.xml is missing {marker}"
                      )

          print("Artifacts:")
          print(
              f"  {wheel.name} "
              f"({wheel.stat().st_size} bytes)"
          )
          print(
              f"  {sdist.name} "
              f"({sdist.stat().st_size} bytes)"
          )
          print(f"Package version: {version}")
          PY

      - name: Verify sdist rebuilds the custom wheel
        shell: bash
        run: |
          set -euo pipefail

          rm -rf sdist-check rebuilt-wheel
          mkdir -p sdist-check rebuilt-wheel

          mapfile -t sdists < <(
            find dist \
              -maxdepth 1 \
              -type f \
              -name '*.tar.gz' \
              -print
          )

          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one sdist."
            exit 1
          fi

          tar -xzf "${sdists[0]}" -C sdist-check

          mapfile -t roots < <(
            find sdist-check \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print
          )

          if [ "${#roots[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one sdist root."
            exit 1
          fi

          (
            cd "${roots[0]}"

            export PYMAVLINK_FAST_INDEX=0
            export MDEF="$PWD/message_definitions"

            python -m build \
              --no-isolation \
              --wheel \
              --outdir "$GITHUB_WORKSPACE/rebuilt-wheel"
          )

          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(
              Path("rebuilt-wheel").glob("*.whl")
          )
          if len(wheels) != 1:
              raise SystemExit(
                  f"Expected one rebuilt wheel, got: {wheels}"
              )

          wheel = wheels[0]
          if not wheel.name.endswith("-py3-none-any.whl"):
              raise SystemExit(
                  f"Unexpected rebuilt wheel: {wheel.name}"
              )

          with zipfile.ZipFile(wheel) as archive:
              common = archive.read(
                  "plane_pymavlink/dialects/v20/common.py"
              ).decode("utf-8")

          for marker in (
              "MAVLink_plane_target_bbox_message",
              "MAVLink_plane_target_id_message",
              "MAVLink_plane_no_target_message",
          ):
              if marker not in common:
                  raise SystemExit(
                      f"Rebuilt wheel is missing {marker}"
                  )

          print(
              "Successfully rebuilt custom wheel from sdist:",
              wheel.name,
          )
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error


  test:
    name: Test / ${{ matrix.target }}
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux x86_64
            runner: ubuntu-24.04

          - target: Linux aarch64
            runner: ubuntu-24.04-arm

          - target: Windows x86_64
            runner: windows-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist

      - name: Set up Python 3.14t
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      - name: Install built wheel
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t wheels < <(
            find dist \
              -maxdepth 1 \
              -type f \
              -name '*.whl' \
              -print
          )

          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one wheel."
            exit 1
          fi

          python -m pip install \
            --force-reinstall \
            --no-deps \
            "${wheels[0]}"

      - name: Smoke-test generated Plane messages
        shell: bash
        run: |
          python - <<'PY'
          import io
          import sysconfig

          if sysconfig.get_config_var("Py_GIL_DISABLED") != 1:
              raise SystemExit(
                  "Expected CPython free-threaded build"
              )

          from plane_pymavlink.dialects.v20 import common

          bbox_cls = common.MAVLink_plane_target_bbox_message
          target_cls = common.MAVLink_plane_target_id_message
          no_target_cls = common.MAVLink_plane_no_target_message

          assert bbox_cls.id == 3
          assert target_cls.id == 9
          assert no_target_cls.id == 10

          assert list(bbox_cls.fieldnames) == [
              "time_boot_ms",
              "shoot_time_ms",
              "time",
              "score",
              "left",
              "top",
              "right",
              "bottom",
              "target_id",
              "track_id",
          ]
          assert list(target_cls.fieldnames) == [
              "time_boot_ms",
              "target_id",
          ]

          mav = common.MAVLink(io.BytesIO())

          bbox = bbox_cls(
              time_boot_ms=1,
              shoot_time_ms=2,
              time=3,
              score=0.9,
              left=0.1,
              top=0.2,
              right=0.8,
              bottom=0.9,
              target_id=7,
              track_id=7,
          )
          target = target_cls(
              time_boot_ms=1,
              target_id=-1,
          )
          no_target = no_target_cls(
              time_boot_ms=1,
              shoot_time_ms=2,
          )

          assert bbox.pack(mav)[1] == 34
          assert target.pack(mav)[1] == 5
          assert no_target.pack(mav)[1] == 8
          assert target.target_id == -1

          print("Plane messages smoke-test OK")
          print("Installed module:", common.__file__)
          PY


  publish:
    name: Publish to devpi
    needs:
      - build
      - test

    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name != 'pull_request'

    runs-on: ubuntu-24.04

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify downloaded artifacts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))

          if len(wheels) != 1:
              raise SystemExit(
                  f"Expected exactly one wheel, got: {wheels}"
              )
          if len(sdists) != 1:
              raise SystemExit(
                  f"Expected exactly one sdist, got: {sdists}"
              )

          wheel = wheels[0]
          sdist = sdists[0]

          if not wheel.name.startswith("plane_pymavlink-"):
              raise SystemExit(
                  f"Unexpected wheel: {wheel.name}"
              )
          if not wheel.name.endswith("-py3-none-any.whl"):
              raise SystemExit(
                  f"Unexpected wheel tag: {wheel.name}"
              )

          with zipfile.ZipFile(wheel) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(
                      f"Corrupt wheel member: {bad}"
                  )

          with tarfile.open(sdist, "r:gz") as archive:
              archive.getmembers()

          print("Ready to publish:")
          print(
              f"  {wheel.name} "
              f"({wheel.stat().st_size} bytes)"
          )
          print(
              f"  {sdist.name} "
              f"({sdist.stat().st_size} bytes)"
          )
          PY

      - name: Install devpi tools
        run: >-
          python -m pip install
          devpi-client
          devpi-tokens

      - name: Publish
        env:
          DEVPI_TOKEN: ${{ secrets.DEVPI_TOKEN }}
          DEVPI_CLIENTDIR: ${{ runner.temp }}/devpi-client
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DEVPI_TOKEN:-}" ]; then
            echo "::error::DEVPI_TOKEN is not available to this repository."
            exit 1
          fi

          TOKEN_FILE="$RUNNER_TEMP/devpi-token"
          printf '%s' "$DEVPI_TOKEN" > "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"

          cleanup() {
            rm -f "$TOKEN_FILE"
            rm -rf "$DEVPI_CLIENTDIR"
          }
          trap cleanup EXIT

          devpi use "$DEVPI_SERVER"
          devpi token-login -f "$TOKEN_FILE"
          devpi use "$DEVPI_TARGET_INDEX"
          devpi upload dist/*
